<rect width="1200" height="360" rx="22" fill="url(#bg)"/><rect width="1200" height="360" rx="22" fill="url(#grid)"/>
<circle cx="1100" cy="80" r="145" fill="#3b99cf" opacity=".09"/><circle cx="20" cy="350" r="180" fill="#2ae0bf" opacity=".07"/>
