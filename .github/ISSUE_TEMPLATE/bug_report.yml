name: Bug report
description: Laporkan masalah yang dapat direproduksi
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Jangan mengirim PIN, cookie, isi pesan, file pengguna, atau rincian eksploitasi keamanan. Lihat SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Versi aplikasi
      placeholder: "2.2.4"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows dan Python
      placeholder: "Windows 11, Python 3.12"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Langkah reproduksi
      placeholder: "1. Buka... 2. Klik... 3. Terjadi..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Hasil yang diharapkan dan hasil aktual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log yang disamarkan (opsional)
      description: Hilangkan data rahasia/pribadi.
